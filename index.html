document.addEventListener('DOMContentLoaded', function() {
    // Initialize Dynamic Responsive Grid
    grid = GridStack.init({
        column: 12,
        cellHeight: 45,
        margin: 6,
        acceptWidgets: true,
        dragIn: '.sidebar-item',
        dragInOptions: { revert: 'invalid', scroll: false, appendTo: 'body', helper: 'clone' },
        float: true // Allow elements to sit freely on lines without jumping to top gaps
    });

    // Listen for structural element drops from the side panel
    grid.on('added', function(event, items) {
        items.forEach(function(item) {
            const el = item.el;
            const type = el.getAttribute('data-type');
            
            if (type && componentTemplates[type]) {
                // Swap out mock preview with editable D&D block HTML content
                el.innerHTML = componentTemplates[type];
                el.removeAttribute('data-type'); 
                saveLayoutState();
            }
        });
    });

    // Re-save system bounds when moving or resizing items
    grid.on('change', saveLayoutState);

    // Fetch state structural schema from Local Browser Cache
    loadLayoutState();
});

/**
 * Clear out current active canvas structure
 */
function clearCanvas() {
    if (confirm("Are you sure you want to clear your current sheet design?")) {
        grid.removeAll();
        localStorage.removeItem('dnd_grid_layout');
    }
}

/**
 * Drop specific targeted node container
 * @param {HTMLElement} button - The delete button clicked inside the component
 */
function removeWidget(button) {
    const gridItem = button.closest('.grid-stack-item');
    grid.removeWidget(gridItem);
    saveLayoutState();
}

/**
 * Commit positional configuration schemas and element values across local storage
 */
function saveLayoutState() {
    const data = grid.save(false); // Retrieves coordinate maps without full internal DOM markup trees
    const elementsData = [];
    
    document.querySelectorAll('.grid-stack-item').forEach((el, index) => {
        const textareas = el.querySelectorAll('textarea');
        const inputs = el.querySelectorAll('input');
        
        elementsData.push({
            html: el.innerHTML,
            inputs: Array.from(inputs).map(i => i.value),
            textareas: Array.from(textareas).map(t => t.value)
        });
    });

    localStorage.setItem('dnd_grid_layout', JSON.stringify({ layout: data, elements: elementsData }));
}

/**
 * Pull previous layouts down onto canvas elements natively 
 */
function loadLayoutState() {
    const stateString = localStorage.getItem('dnd_grid_layout');
    if (!stateString) return;

    const state = JSON.parse(stateString);
    grid.load(state.layout);

    // Re-bind content changes onto matching elements
    const items = document.querySelectorAll('.grid-stack-item');
    items.forEach((el, index) => {
        if (state.elements[index]) {
            el.innerHTML = state.elements[index].html;
            
            const inputs = el.querySelectorAll('input');
            inputs.forEach((input, i) => {
                if (state.elements[index].inputs[i] !== undefined) {
                    input.value = state.elements[index].inputs[i];
                }
            });

            const textareas = el.querySelectorAll('textarea');
            textareas.forEach((textarea, t) => {
                if (state.elements[index].textareas[t] !== undefined) {
                    textarea.value = state.elements[index].textareas[t];
                }
            });
        }
    });
}

/**
 * Compile canvas viewport area downward directly into printable vector PDF arrays
 */
function exportToPDF() {
    const element = document.getElementById('print-area');
    
    // Temporarily hide functional UI buttons like deletion triggers during clean prints
    const style = document.createElement('style');
    style.innerHTML = '.group hover\\:opacity-100, button { display: none !important; } header button { display: inline-block !important; }';
    document.head.appendChild(style);

    const opt = {
        margin:       0,
        filename:     'my_dnd_character_sheet.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        style.remove(); // Re-enable active UI bounds on render cycles completion
    });
}
